<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>送信完了｜内面セッションプラン</title>
<style>
  :root {
    --pink: #ff6b9d;
    --pink-soft: #ffe4ef;
    --purple: #7c5cff;
    --bg: #fff7fa;
    --card: #ffffff;
    --text: #2b2430;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .app {
    min-height: 100vh;
    max-width: 430px;
    margin: 0 auto;
    background: var(--card);
    padding: 48px 22px 64px;
  }
  .badge {
    display: inline-block;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: #5b3d8a;
    background: #f6f0ff;
    border-radius: 999px;
    padding: 6px 12px;
    margin-bottom: 16px;
  }
  h1 {
    font-size: 18px;
    line-height: 1.55;
    margin: 0 0 16px;
  }
  p {
    font-size: 14px;
    line-height: 1.85;
    margin: 0 0 12px;
    color: #4a3f4c;
  }
</style>
</head>
<body>
  <div class="app">
    <div class="badge">内面セッションプラン</div>
    <h1>送信、ありがとうございました。</h1>
    <p>いま書いていただいた内容は、内面セッションプランとして届いています。</p>
    <p>はにぃが初回のときに、この用紙を開いて話します。</p>
    <p>この画面は閉じて大丈夫です。</p>
  </div>
<script>
(function () {
  var raw = "";
  try { raw = sessionStorage.getItem("enrollPayload") || ""; } catch (e) {}
  if (!raw) return;
  try { sessionStorage.removeItem("enrollPayload"); } catch (e) {}
  fetch("https://script.google.com/macros/s/AKfycbwQ9Q_SRfHoOlVkaXb0l3dFvxru5HNvr9l8q4-GyDuQSaYDsTjc4LnGm-xrgdsWsbhzlA/exec", {
    method: "POST",
    mode: "no-cors",
    keepalive: true,
    headers: { "Content-Type": "text/plain;charset=UTF-8" },
    body: raw
  });
})();
</script>
</body>
</html>
