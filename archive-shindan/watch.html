<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>三日間限定｜恋愛オーダーノート完全攻略セミナー</title>
<link rel="stylesheet" href="result.css?v=84">
<style>
  .watch {
    max-width: 430px;
    margin: 0 auto;
    padding: 24px 18px 48px;
  }
  .watch-badge {
    display: inline-block;
    padding: 6px 14px;
    border-radius: 999px;
    background: #fff;
    border: 1px solid #f3cfe0;
    color: #b5487a;
    font-size: .75rem;
    font-weight: 800;
    letter-spacing: .08em;
  }
  .watch h1 {
    font-size: 1.28rem;
    line-height: 1.55;
    margin: 14px 0 8px;
    color: #7c3f6e;
  }
  .watch .type-line {
    font-size: .9rem;
    font-weight: 700;
    color: #7c5cff;
    margin: 0 0 12px;
  }
  .watch .remain {
    margin: 0 0 16px;
    font-size: .92rem;
    font-weight: 800;
    color: #c44d79;
  }
  .poster {
    display: block;
    width: 100%;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(255, 107, 157, 0.18);
  }
  .poster img { width: 100%; display: block; }
  .watch-copy {
    margin: 18px 0;
    font-size: .9rem;
    line-height: 1.85;
    color: #2b2430;
  }
  .watch-copy p { margin: 0 0 1em; }
  .ended {
    padding: 18px 14px;
    border-radius: 14px;
    background: #fff;
    border: 1px solid #f0dce6;
  }
  iframe.player {
    width: 100%;
    min-height: 240px;
    border: 0;
    border-radius: 16px;
    margin: 12px 0 18px;
    background: #1a1220;
  }
</style>
</head>
<body>
<div class="watch" id="watch">
  <span class="watch-badge">三日間限定公開</span>
  <h1>恋愛オーダーノート<br>完全攻略セミナー</h1>
  <p class="type-line" id="typeLine"></p>
  <p class="remain" id="remain"></p>
  <a class="poster" id="posterLink" href="#">
    <img src="images/seminar-archive.jpg" alt="恋愛オーダーノート完全攻略セミナー" width="1920" height="1080">
  </a>
  <iframe class="player" id="player" hidden title="セミナーアーカイブ" allowfullscreen></iframe>
  <div class="watch-copy" id="copy"></div>
  <a class="primary-btn" id="playBtn" href="#">アーカイブを再生する</a>
  <p class="btn-note">講師 はにぃ｜進行役 望月｜500名即完の回です。</p>
  <a class="ghost-btn" href="index.html">診断トップへ戻る</a>
</div>
<script src="types-data.js?v=archive13"></script>
<script src="archive-window.js"></script>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var key = (params.get("id") || "").toUpperCase();
  var result = window.RESULTS[key];
  var remain = document.getElementById("remain");
  var typeLine = document.getElementById("typeLine");
  var copy = document.getElementById("copy");
  var playBtn = document.getElementById("playBtn");
  var posterLink = document.getElementById("posterLink");
  var player = document.getElementById("player");
  var url = window.SEMINAR_ARCHIVE_URL || "";

  window.archiveEnsureWindow();
  remain.textContent = window.archiveRemainText();

  if (result) {
    typeLine.textContent = "あなたのタイプ：" + result.name;
    copy.innerHTML = "<p>この恋愛オーダーノート完全攻略セミナーは、<br>前回500名の予約枠が即日埋まった<br>大人気のセミナーです。</p><p>愛され周波数タイプ診断を受けた方限定で、<br>大人気のセミナーを3日間限定で<br>視聴できる機会を設けました。</p><p>この機会にぜひご視聴ください。</p>";
  } else {
    typeLine.textContent = "診断結果を手元に置いて、見てください。";
    copy.innerHTML = "<p>この恋愛オーダーノート完全攻略セミナーは、<br>前回500名の予約枠が即日埋まった<br>大人気のセミナーです。</p><p>愛され周波数タイプ診断を受けた方限定で、<br>大人気のセミナーを3日間限定で<br>視聴できる機会を設けました。</p><p>この機会にぜひご視聴ください。</p>";
  }

  function toEmbed(src) {
    var m = String(src).match(/[?&]v=([a-zA-Z0-9_-]+)/);
    if (m) return "https://www.youtube.com/embed/" + m[1] + "?rel=0";
    m = String(src).match(/youtu\.be\/([a-zA-Z0-9_-]+)/);
    if (m) return "https://www.youtube.com/embed/" + m[1] + "?rel=0";
    return src;
  }

  function openArchive() {
    if (!window.archiveIsOpen()) return;
    if (!url) return;
    var embed = toEmbed(url);
    if (embed.indexOf("youtube.com/embed") >= 0) {
      player.src = embed;
      player.hidden = false;
      window.scrollTo({ top: player.offsetTop - 20, behavior: "smooth" });
      return;
    }
    location.href = url;
  }

  if (!window.archiveIsOpen()) {
    document.getElementById("watch").innerHTML =
      '<div class="ended"><p class="remain">公開は終了しました</p><p>三日間の公開が終わりました。診断トップへ戻ってください。</p><p><a class="ghost-btn" href="index.html">診断トップへ戻る</a></p></div>';
    return;
  }

  if (url) {
    playBtn.href = url;
    posterLink.href = url;
    playBtn.addEventListener("click", function (e) {
      if (toEmbed(url).indexOf("youtube.com/embed") >= 0) {
        e.preventDefault();
        openArchive();
      }
    });
    posterLink.addEventListener("click", function (e) {
      if (toEmbed(url).indexOf("youtube.com/embed") >= 0) {
        e.preventDefault();
        openArchive();
      }
    });
  } else {
    playBtn.textContent = "アーカイブを再生する";
    playBtn.addEventListener("click", function (e) {
      e.preventDefault();
    });
    posterLink.addEventListener("click", function (e) {
      e.preventDefault();
    });
  }

  setInterval(function () {
    if (!window.archiveIsOpen()) location.reload();
    else remain.textContent = window.archiveRemainText();
  }, 30000);
})();
</script>
</body>
</html>
