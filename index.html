<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>セッション2の事前ワーク</title>
<meta name="description" content="セッション2の前に、過去の恋愛で起きたことと思ったことを書いてもらうシートです。">
<style>
  :root {
    --pink: #ff6b9d;
    --pink-soft: #ffe4ef;
    --purple: #7c5cff;
    --bg: #fff7fa;
    --card: #ffffff;
    --text: #2b2430;
    --muted: #8a7f8f;
    --line: #f0dce6;
    --shadow: 0 10px 30px rgba(255, 107, 157, 0.12);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  .app {
    min-height: 100vh;
    max-width: 430px;
    margin: 0 auto;
    background: var(--card);
    box-shadow: 0 0 40px rgba(80, 40, 70, 0.06);
    padding: 0 0 64px;
  }
  .hero {
    padding: 36px 22px 20px;
    background: linear-gradient(180deg, #fff0f6 0%, #fff 72%);
    text-align: center;
  }
  .badge {
    display: inline-block;
    font-size: 12px;
    letter-spacing: 0.04em;
    color: #c44d7a;
    background: var(--pink-soft);
    border-radius: 999px;
    padding: 8px 14px;
    margin-bottom: 14px;
    line-height: 1.7;
  }
  h1 {
    margin: 0 0 8px;
    font-size: 18px;
    line-height: 1.55;
    font-weight: 700;
  }
  .lead {
    margin: 14px 0 0;
    font-size: 14px;
    line-height: 1.85;
    color: #4a3f4c;
    text-align: left;
  }
  form { padding: 8px 22px 0; }
  .sec {
    margin: 10px 0 22px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
  }
  .sec:first-child { border-top: 0; padding-top: 0; }
  .sec h2, .subhead {
    margin: 0 0 14px;
    font-size: 15px;
    line-height: 1.5;
    font-weight: 700;
  }
  .subhead { margin-top: 8px; }
  .ask {
    margin: 0 0 14px;
    font-size: 14px;
    line-height: 1.85;
    color: #4a3f4c;
  }
  .field { margin: 0 0 18px; }
  label {
    display: block;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 8px;
    line-height: 1.7;
  }
  label span {
    font-weight: 500;
    color: var(--muted);
    font-size: 12px;
    margin-left: 6px;
  }
  label span.long {
    display: block;
    margin-left: 0;
    margin-top: 4px;
    line-height: 1.7;
  }
  .hint {
    margin: 0 0 14px;
    font-size: 14px;
    line-height: 1.85;
    color: #4a3f4c;
    font-weight: 500;
  }
  textarea {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 16px;
    font-family: inherit;
    color: var(--text);
    background: #fff;
    outline: none;
    min-height: 96px;
    resize: vertical;
    line-height: 1.6;
  }
  textarea:focus {
    border-color: #f3a0bd;
    box-shadow: 0 0 0 3px rgba(255, 107, 157, 0.15);
  }
  .choices { display: grid; gap: 8px; }
  .choice {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 12px;
    background: #fff;
    cursor: pointer;
    font-weight: 500;
  }
  .choice:has(input:checked) {
    border-color: #f3a0bd;
    background: #fff7fa;
  }
  .choice input { margin-top: 3px; accent-color: var(--pink); }
  .choice-text { font-size: 14px; line-height: 1.5; font-weight: 500; }
  .reveal { display: none; }
  .reveal.is-on { display: block; }
  #after.is-on { display: flex; flex-direction: column; }
  .add {
    width: 100%;
    margin: 0 0 18px;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 14px 18px;
    font-size: 15px;
    font-weight: 700;
    font-family: inherit;
    color: var(--text);
    background: #fff;
    cursor: pointer;
  }
  .submit {
    width: 100%;
    border: 0;
    border-radius: 999px;
    padding: 16px 18px;
    margin-top: 28px;
    font-size: 16px;
    font-weight: 700;
    font-family: inherit;
    color: #fff;
    background: linear-gradient(90deg, var(--pink), var(--purple));
    box-shadow: var(--shadow);
    cursor: pointer;
  }
  .err {
    display: none;
    margin-top: 6px;
    font-size: 12px;
    color: #c0392b;
    line-height: 1.7;
  }
  .err.is-on { display: block; }
  .done { display: none; padding: 36px 22px 24px; }
  .done.is-on { display: block; }
  .done h1 { font-size: 18px; line-height: 1.6; margin: 0 0 16px; }
  .done p {
    font-size: 14px;
    line-height: 1.85;
    margin: 0 0 14px;
    color: #4a3f4c;
  }
  .done .msg {
    margin: 0;
    padding: 14px 16px;
    border-radius: 12px;
    background: #fff7fa;
    border: 1px solid var(--line);
    font-size: 14px;
    line-height: 1.8;
    color: var(--text);
    white-space: pre-wrap;
  }
  .done .add { margin-top: 12px; }
</style>
</head>
<body>
  <div class="app">
    <div class="hero">
      <div class="badge">セッション2</div>
      <h1>事前ワーク</h1>
      <p class="lead">
        自分でパターンを<br>
        まとめなくて大丈夫です。<br><br>
        起きたことと、<br>
        そのとき思ったことを<br>
        書いてください。<br>
        セッションで一緒に見ます。
      </p>
    </div>

    <form id="sheet">
      <div class="sec">
        <h2>最初の質問</h2>
        <p class="ask">これまでの恋愛や、<br>誰かを好きになった経験で、<br>今でもふと思い出すものは<br>ありますか？</p>
        <div class="choices">
          <label class="choice"><input type="radio" name="gate" value="1"><span class="choice-text">① 思い浮かぶ経験がある</span></label>
          <label class="choice"><input type="radio" name="gate" value="2"><span class="choice-text">② 少しはあるけれど、何を書けばいいか迷う</span></label>
          <label class="choice"><input type="radio" name="gate" value="3"><span class="choice-text">③ 思い浮かぶ経験がほとんどない</span></label>
        </div>
      </div>

      <div id="after" class="reveal">
        <div class="sec" id="expSec">
          <p class="hint reveal" id="countNote">合計3名のことを書いてください。</p>
          <h2 id="expHead" hidden>1人目</h2>
          <p class="hint reveal" id="expNote">付き合った相手だけではありません。<br>片思い、曖昧なまま終わった<br>関係の方も踏まえ、ご記入ください。</p>
          <button type="button" class="add reveal" id="open1">好きになりかけた人を書く</button>
          <div id="block1" class="reveal"></div>
          <button type="button" class="add reveal" id="open2">2人目を書く</button>
          <div id="block2" class="reveal">
            <p class="subhead" id="sub2">2人目</p>
          </div>
          <button type="button" class="add reveal" id="open3">3人目を書く</button>
          <div id="block3" class="reveal">
            <p class="subhead" id="sub3">3人目</p>
          </div>
        </div>

        <div class="sec" id="lastSec">
          <h2>最後の質問</h2>
          <div class="field">
            <label for="now">今の恋や、<br>友人・家族とのやりとりで、<br>昔と同じことをしていると<br>感じる場面はありますか。 <span>必須</span>
              <span class="long">あれば、最近の場面を<br>1つ書いてください。<br>誰が、何をして、<br>自分は何をしましたか。<br>なければ、「ない」で大丈夫です。</span>
            </label>
            <textarea id="now" name="now"></textarea>
          </div>
        </div>

        <div class="err" id="error"></div>
        <button class="submit" id="submitBtn" type="submit">書いた内容を確認する</button>
      </div>
    </form>

    <div class="done" id="done">
      <h1>書けました</h1>
      <p>この内容を、<br>セッション2に持ってきてください。<br>このページを閉じても、<br>このスマホの中に保存します。</p>
      <div class="msg" id="summary"></div>
      <button type="button" class="submit" id="copy">この内容をコピーする</button>
      <button type="button" class="add" id="back">書き直す</button>
    </div>
  </div>
<script>
(function () {
  var form = document.getElementById("sheet");
  var done = document.getElementById("done");
  var error = document.getElementById("error");
  var after = document.getElementById("after");
  var KEY = "session2-prep-v2";
  var keys = ["r1","e1","f1","w1","b1","r2","e2","f2","w2","b2","r3","e3","f3","w3","b3","now"];
  var opened = {
    "1": { b2: false, b3: false },
    "2": { b2: false, b3: false },
    "3": { b1: false, b2: false, b3: false }
  };
  var qTitle = {
    r: "その人とは、どんな関係でしたか。",
    e: "そのとき、何がありましたか。",
    f: "そのとき、自分は何と思っていましたか。",
    w: "そのとき、本当は何をしたかったですか。",
    b: "そのあと、自分にどんな言葉を言うようになりましたか。"
  };
  var qHelp = {
    "1": {
      r: ["付き合っていた、片思い、", "曖昧なまま、など、", "自分の言葉で書いてください。"],
      e: ["どこで、相手は何をして、", "自分は何をしましたか。"],
      f: ["「嫌われた」", "「私ばっかり」など、", "頭に浮かんだ言葉をそのまま。"],
      w: ["送りたかった文、", "言いたかったこと、", "やめたかったこと。"],
      b: ["例は、", "「本音を出したら嫌われる」", "「どうせまたいなくなる」です。"]
    },
    "2": {
      r: ["元彼、片思い、", "曖昧なまま、のどれに近いか", "書いてください。"],
      e: ["場所はどこでしたか。", "相手は何をしましたか。", "自分は何をしましたか。"],
      f: ["浮かんだ言葉を、", "そのまま書いてください。"],
      w: ["送りたかった文を、", "そのまま書いてください。"],
      b: ["あとから自分に言う言葉を、", "そのまま書いてください。"]
    },
    "3": {
      r: ["付き合っていた、片思い、", "曖昧なまま、など、", "自分の言葉で書いてください。"],
      e: ["どこで、相手は何をして、", "自分は何をしましたか。"],
      f: ["頭に浮かんだ言葉を、", "そのまま書いてください。"],
      w: ["送りたかった文、", "言いたかったこと、", "やめたかったこと。"],
      b: ["あとから自分に言う言葉を、", "そのまま書いてください。"]
    }
  };
  var parts = ["r", "e", "f", "w", "b"];

  function fieldHtml(n, part, helpLines) {
    var id = part + n;
    return '<div class="field"><label for="' + id + '">' + qTitle[part] + ' <span>必須</span><span class="long">' + helpLines.join("<br>") + '</span></label><textarea id="' + id + '" name="' + id + '"></textarea></div>';
  }
  function paintBlock(n, help) {
    var html = parts.map(function (part) { return fieldHtml(n, part, help[part]); }).join("");
    var box = document.getElementById("block" + n);
    var head = box.querySelector(".subhead");
    if (head) html = head.outerHTML + html;
    box.innerHTML = html;
  }
  function paintAll(g) {
    [1, 2, 3].forEach(function (n) { paintBlock(n, qHelp[g]); });
  }

  function gate() {
    var picked = form.querySelector("input[name=gate]:checked");
    return picked ? picked.value : "";
  }
  function show(el, on) { el.classList.toggle("is-on", !!on); }
  function blockOn(g, n) {
    if (!g) return false;
    if (n === 1) return g !== "3" || opened["3"].b1;
    if (n === 2) return !!opened[g].b2;
    return !!opened[g].b3;
  }

  function capture() {
    var data = {};
    keys.forEach(function (k) {
      var el = document.getElementById(k);
      if (el) data[k] = el.value;
    });
    return data;
  }
  function restore(data) {
    keys.forEach(function (k) {
      var el = document.getElementById(k);
      if (el && data[k]) el.value = data[k];
    });
  }
  function sync() {
    var g = gate();
    var prev = capture();
    show(after, !!g);
    error.classList.remove("is-on");
    if (!g) return;
    paintAll(g);
    restore(prev);
    var b1 = blockOn(g, 1);
    var b2 = blockOn(g, 2);
    var b3 = blockOn(g, 3);
    document.getElementById("expHead").hidden = !b1;
    document.getElementById("expHead").textContent = g === "1" ? "1人目" : (g === "2" ? "1人目" : "その人");
    show(document.getElementById("countNote"), (g === "1" || g === "2") && b1);
    show(document.getElementById("expNote"), b1);
    show(document.getElementById("open1"), g === "3" && !opened["3"].b1);
    show(document.getElementById("block1"), b1);
    show(document.getElementById("open2"), b1 && !b2);
    show(document.getElementById("block2"), b2);
    show(document.getElementById("open3"), b2 && !b3);
    show(document.getElementById("block3"), b3);
    document.getElementById("open2").textContent = "2人目を書く";
    document.getElementById("open3").textContent = "3人目を書く";
    document.getElementById("sub2").textContent = "2人目";
    document.getElementById("sub3").textContent = "3人目";
    document.getElementById("expSec").style.order = g === "3" ? "2" : "1";
    document.getElementById("lastSec").style.order = g === "3" ? "1" : "2";
    document.getElementById("error").style.order = "3";
    document.getElementById("submitBtn").style.order = "4";
  }

  document.getElementById("open1").addEventListener("click", function () {
    opened["3"].b1 = true;
    sync();
  });
  document.getElementById("open2").addEventListener("click", function () {
    var g = gate();
    if (g) opened[g].b2 = true;
    sync();
  });
  document.getElementById("open3").addEventListener("click", function () {
    var g = gate();
    if (g) opened[g].b3 = true;
    sync();
  });
  form.addEventListener("change", function (ev) {
    if (ev.target && ev.target.name === "gate") sync();
  });

  function val(id) {
    var el = document.getElementById(id);
    return el ? el.value.trim() : "";
  }
  function block(n) {
    return { relation: val("r" + n), event: val("e" + n), feeling: val("f" + n), wanted: val("w" + n), after: val("b" + n) };
  }
  function complete(b) {
    return b.relation && b.event && b.feeling && b.wanted && b.after;
  }

  function load() {
    try {
      var saved = JSON.parse(localStorage.getItem(KEY) || "null");
      if (!saved) return;
      if (saved.opened) opened = saved.opened;
      if (saved.gate) {
        var radio = form.querySelector("input[name=gate][value='" + saved.gate + "']");
        if (radio) radio.checked = true;
      }
      sync();
      keys.forEach(function (k) {
        if (saved[k] && document.getElementById(k)) document.getElementById(k).value = saved[k];
      });
    } catch (e) {}
  }

  function payload() {
    var data = { gate: gate(), opened: opened };
    keys.forEach(function (k) { data[k] = val(k); });
    return data;
  }

  function textOf(data) {
    var gateLabel = {
      "1": "① 思い浮かぶ経験がある",
      "2": "② 少しはあるけれど、何を書けばいいか迷う",
      "3": "③ 思い浮かぶ経験がほとんどない"
    };
    var lines = ["セッション2の事前ワーク", "", "最初の質問", gateLabel[data.gate] || ""];
    [1, 2, 3].forEach(function (n) {
      if (!blockOn(data.gate, n)) return;
      var b = { relation: data["r" + n], event: data["e" + n], feeling: data["f" + n], wanted: data["w" + n], after: data["b" + n] };
      var title = n === 1 ? (data.gate === "3" ? "その人" : "1人目") : (n + "人目");
      lines.push("", title);
      lines.push("関係：" + b.relation);
      lines.push("出来事：" + b.event);
      lines.push("そのとき思ったこと：" + b.feeling);
      lines.push("本当は何をしたかったか：" + b.wanted);
      lines.push("そのあと自分に言う言葉：" + b.after);
    });
    lines.push("", "今も同じことをしている場面", data.now);
    return lines.join("\n");
  }

  form.addEventListener("submit", function (ev) {
    ev.preventDefault();
    error.classList.remove("is-on");
    var g = gate();
    if (!g) return fail("最初の質問を選んでください。");
    var names = { 1: "1人目", 2: "2人目", 3: "3人目" };
    if (g === "3") names = { 1: "その人", 2: "2人目", 3: "3人目" };
    for (var n = 1; n <= 3; n++) {
      if (blockOn(g, n) && !complete(block(n))) {
        return fail(names[n] + "は、5つの欄をすべて書いてください。");
      }
    }
    if (!val("now")) return fail("最後の質問を書いてください。なければ「ない」と書いてください。");
    var data = payload();
    try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {}
    document.getElementById("summary").textContent = textOf(data);
    form.hidden = true;
    document.querySelector(".hero").hidden = true;
    done.classList.add("is-on");
    window.scrollTo(0, 0);
  });

  function fail(msg) {
    error.classList.add("is-on");
    error.textContent = msg;
    error.scrollIntoView({ behavior: "smooth", block: "center" });
  }

  document.getElementById("copy").addEventListener("click", function () {
    var text = document.getElementById("summary").textContent;
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text);
    this.textContent = "コピーしました";
  });
  document.getElementById("back").addEventListener("click", function () {
    done.classList.remove("is-on");
    form.hidden = false;
    document.querySelector(".hero").hidden = false;
    document.getElementById("copy").textContent = "この内容をコピーする";
  });

  load();
})();
</script>
</body>
</html>
