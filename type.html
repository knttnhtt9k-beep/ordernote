<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>愛される周波数タイプ</title>
<meta property="og:title" content="愛される周波数タイプ診断">
<link rel="stylesheet" href="result.css?v=17">
</head>
<body>
<div class="page" id="page">
  <div class="cover">
    <!-- タイプ名は画像に焼き込み済み -->
    <img id="typeImage" alt="" width="960" height="640">
    <h1 id="typeName" class="sr-only"></h1>
    <span id="typeCode" class="sr-only"></span>
  </div>
  <style>.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}</style>

  <div class="body">
    <p class="lead-line" id="typeLead"></p>
    <div class="keywords" id="typeKeywords"></div>
    <p class="desc" id="typeDesc"></p>
  </div>

  <div class="scores" id="scoresWrap" style="display:none">
    <h3>あなたの周波数スコア</h3>
    <div id="scoreBoard"></div>
  </div>

  <div class="cta-box">
    <h3 id="ctaTitle"></h3>
    <p class="myth-reframe" id="ctaMyth"></p>
    <p class="benefits-label">愛される周波数へ変えていくと、こんな変化が現れます</p>
    <ul id="ctaBenefits"></ul>

    <div class="worldview" id="worldview"></div>

    <div class="action-box">
      <p class="action-lead" id="actionLead">今すぐ申し込む（診断結果つき優先案内）</p>
      <p class="action-text" id="actionText"></p>
      <a class="primary-btn" id="seminarBtn" href="#">今すぐ無料セミナーに申し込む</a>
      <p class="action-note" id="seminarBtnNote">完全無料・約90分・オンライン｜先着枠あり</p>
      <button class="copy-btn" id="copyBtn" type="button">診断結果をコピーしてLINEへ送る</button>
      <p class="action-note" id="copyNote">コピーしたら、すぐLINEに貼って送ってください。送った方から優先案内します。</p>
      <p class="action-warn" id="seminarScene"></p>
    </div>

    <a class="ghost-btn" href="index.html">診断トップへ戻る</a>
    <div class="nav-links">
      <a href="gallery.html">全タイプ一覧を見る</a>
    </div>
  </div>
</div>

<script src="types-data.js?v=31"></script>
<script src="images-embed.js?v=1"></script>
<script>
(function () {
  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }
  function markBold(s) {
    return escapeHtml(s).replace(/\*\*(.+?)\*\*/g, '<strong class="hl">$1</strong>');
  }
  /** 段落＝空行。箇条書きはul。余計な<br>を増やさない */
  function setRich(el, text) {
    if (!el) return;
    if (!text) {
      el.textContent = "";
      el.style.display = "none";
      return;
    }
    el.style.display = "";
    const blocks = String(text).trim().split(/\n\n+/);
    const html = blocks.map((block) => {
      const lines = block.split("\n").map((l) => l.trimEnd());
      const out = [];
      let buf = [];
      let bullets = [];
      const flushText = () => {
        if (!buf.length) return;
        out.push('<p class="para">' + markBold(buf.join("\n")).replace(/\n/g, "<br>") + "</p>");
        buf = [];
      };
      const flushBullets = () => {
        if (!bullets.length) return;
        out.push(
          '<ul class="bullet-list">' +
            bullets.map((l) => "<li>" + markBold(l.replace(/^・\s*/, "")) + "</li>").join("") +
            "</ul>"
        );
        bullets = [];
      };
      lines.forEach((line) => {
        if (/^・/.test(line)) {
          flushText();
          bullets.push(line);
        } else {
          flushBullets();
          if (line.trim()) buf.push(line);
        }
      });
      flushText();
      flushBullets();
      return out.join("");
    }).join("");
    el.innerHTML = html;
  }

  const params = new URLSearchParams(location.search);
  const key = (params.get("id") || "").toUpperCase();
  const result = window.RESULTS[key];

  if (!result) {
    document.getElementById("page").innerHTML =
      '<div class="body"><p>タイプが見つかりません。<a href="index.html">診断トップへ</a></p></div>';
    return;
  }

  document.title = result.name + "｜愛される周波数タイプ診断";
  document.querySelector('meta[property="og:title"]').setAttribute("content", result.name);

  // 埋め込み画像優先（imagesフォルダ未アップロードでも表示）
  const embedded = window.TYPE_IMAGES && window.TYPE_IMAGES[key];
  document.getElementById("typeImage").src = embedded || result.image;
  document.getElementById("typeImage").alt = result.name;
  document.getElementById("typeName").textContent = result.name;
  document.getElementById("typeCode").textContent = result.code;
  setRich(document.getElementById("typeLead"), result.lead);
  setRich(document.getElementById("typeDesc"), result.desc);
  document.getElementById("ctaTitle").textContent =
    window.SEMINAR_CTA_TITLE || "次は、無料セミナーへ申し込む";
  setRich(document.getElementById("ctaMyth"), window.SEMINAR_CTA || "");
  setRich(document.getElementById("worldview"), window.WORLDVIEW || "");
  setRich(document.getElementById("seminarScene"), result.seminarScene || "");

  const seminarBtn = document.getElementById("seminarBtn");
  const seminarBtnNote = document.getElementById("seminarBtnNote");
  const actionLead = document.getElementById("actionLead");
  const actionText = document.getElementById("actionText");
  if (actionLead && window.ACTION_LEAD) {
    actionLead.textContent = window.ACTION_LEAD;
  }
  setRich(actionText, result.actionText || window.ACTION_TEXT || "");
  if (seminarBtn) {
    seminarBtn.href = window.SEMINAR_URL || "#";
    seminarBtn.textContent = window.SEMINAR_CTA_BUTTON || "今すぐ無料セミナーに申し込む";
  }
  if (seminarBtnNote && window.SEMINAR_CTA_NOTE) {
    seminarBtnNote.textContent = window.SEMINAR_CTA_NOTE;
  }

  const kw = document.getElementById("typeKeywords");
  (result.keywords || []).forEach((k) => {
    const span = document.createElement("span");
    span.className = "keyword-chip";
    span.textContent = k;
    kw.appendChild(span);
  });

  const ul = document.getElementById("ctaBenefits");
  result.benefits.forEach((b) => {
    const li = document.createElement("li");
    li.textContent = b;
    ul.appendChild(li);
  });

  const copyBtn = document.getElementById("copyBtn");
  const copyNote = document.getElementById("copyNote");
  const copyText = result.lineCopy || `診断結果：${result.name}\nセミナー当日、この結果を見ながら聞きます。`;
  copyBtn.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(copyText);
    } catch (e) {
      const ta = document.createElement("textarea");
      ta.value = copyText;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
    }
    copyBtn.textContent = "コピーしました";
    copyNote.textContent = window.ACTION_COPY_NOTE || "すぐLINEに貼って送ってください。送った方から優先案内します。";
    setTimeout(() => {
      copyBtn.textContent = "診断結果をコピーしてLINEへ送る";
    }, 2500);
  });

  try {
    const order = ["T1", "T2", "T3"];
    let scores = null;

    const sParam = params.get("s");
    if (sParam) {
      const parts = sParam.split(",").map((n) => parseInt(n, 10));
      if (parts.length === order.length && parts.every((n) => Number.isFinite(n))) {
        scores = {};
        order.forEach((type, i) => { scores[type] = parts[i]; });
      }
    }

    if (!scores && sessionStorage.getItem("freqType") === key) {
      const raw = sessionStorage.getItem("freqScores");
      if (raw) scores = JSON.parse(raw);
    }

    if (scores) {
      const board = document.getElementById("scoreBoard");
      order.forEach((type) => {
        const row = document.createElement("div");
        row.className = "score-row score-row-3";
        const val = scores[type] || 0;
        const label = (window.TYPE_LABEL && window.TYPE_LABEL[type]) || type;
        row.innerHTML = `
          <span>${label}</span>
          <div class="meter"><i style="width:${(val / 5) * 100}%"></i></div>
          <span>${val}</span>
        `;
        board.appendChild(row);
      });
      document.getElementById("scoresWrap").style.display = "block";
    }
  } catch (e) {}
})();
</script>
</body>
</html>
