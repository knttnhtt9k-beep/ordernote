<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>愛される周波数タイプ</title>
<meta property="og:title" content="愛される周波数タイプ診断">
<link rel="stylesheet" href="result.css?v=12">
</head>
<body>
<div class="page" id="page">
  <div class="cover">
    <!-- タイプ名は画像に焼き込み済み -->
    <img id="typeImage" alt="" width="960" height="640">
    <h1 id="typeName" class="sr-only"></h1>
    <span id="typeCode" class="sr-only"></span>
  </div>
  <style>.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}</style>

  <div class="body">
    <p class="lead-line" id="typeLead"></p>
    <div class="keywords" id="typeKeywords"></div>
    <p class="desc" id="typeDesc"></p>
  </div>

  <div class="scores" id="scoresWrap" style="display:none">
    <h3>あなたの周波数スコア</h3>
    <div id="scoreBoard"></div>
  </div>

  <div class="cta-box">
    <h3 id="ctaTitle"></h3>
    <p class="next-step" id="ctaNextStep"></p>
    <p class="myth-reframe" id="ctaMyth"></p>
    <p class="watch-note" id="ctaWatch"></p>
    <p class="why" id="ctaWhy"></p>
    <p class="benefits-label">愛される周波数に変わると、こんな変化が現れます</p>
    <ul id="ctaBenefits"></ul>

    <div class="action-box">
      <p class="action-lead">今すぐできること（持参ミッション）</p>
      <p class="action-text">
        下の文をコピーして、LINEのトーク画面に送ってください。<br>
        セミナー当日、この結果を手元に置いて聞きます。
      </p>
      <button class="copy-btn" id="copyBtn" type="button">持参文をコピーする</button>
      <p class="action-note" id="copyNote">コピーしたら、そのままLINEに貼って送ってください。</p>
      <p class="action-warn" id="seminarScene"></p>
      <p class="action-consult-bridge" id="consultBridge"></p>
      <p class="action-consult" id="consultHint"></p>
    </div>

    <a class="ghost-btn" href="index.html">診断トップへ戻る</a>
    <div class="nav-links">
      <a href="gallery.html">全タイプ一覧を見る</a>
    </div>
  </div>
</div>

<script src="types-data.js?v=18"></script>
<script src="images-embed.js?v=1"></script>
<script>
(function () {
  /** **強調**・箇条書き・改行をHTMLへ（読み飛ばし層向け） */
  function setRich(el, text) {
    if (!el) return;
    if (!text) {
      el.textContent = "";
      return;
    }
    let html = String(text)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/\*\*(.+?)\*\*/g, '<strong class="hl">$1</strong>');
    // 連続する「・行」をulにまとめる
    html = html.replace(/(?:^|\n)((?:・.+(?:\n|$))+)/g, (block) => {
      const items = block.trim().split("\n").filter((l) => l.startsWith("・"));
      if (!items.length) return block;
      return "\n<ul class=\"bullet-list\">" +
        items.map((l) => "<li>" + l.replace(/^・/, "") + "</li>").join("") +
        "</ul>\n";
    });
    el.innerHTML = html.replace(/\n/g, "<br>");
  }

  const params = new URLSearchParams(location.search);
  const key = (params.get("id") || "").toUpperCase();
  const result = window.RESULTS[key];

  if (!result) {
    document.getElementById("page").innerHTML =
      '<div class="body"><p>タイプが見つかりません。<a href="index.html">診断トップへ</a></p></div>';
    return;
  }

  document.title = result.name + "｜愛される周波数タイプ診断";
  document.querySelector('meta[property="og:title"]').setAttribute("content", result.name);

  // 埋め込み画像優先（imagesフォルダ未アップロードでも表示）
  const embedded = window.TYPE_IMAGES && window.TYPE_IMAGES[key];
  document.getElementById("typeImage").src = embedded || result.image;
  document.getElementById("typeImage").alt = result.name;
  document.getElementById("typeName").textContent = result.name;
  document.getElementById("typeCode").textContent = result.code;
  setRich(document.getElementById("typeLead"), result.lead);
  setRich(document.getElementById("typeDesc"), result.desc);
  document.getElementById("ctaTitle").textContent = "診断で終わりではありません。続きはセミナーへ";
  // NEXT_STEPはmythReframeに統合済み（空なら非表示）
  const nextEl = document.getElementById("ctaNextStep");
  if (window.NEXT_STEP) {
    setRich(nextEl, window.NEXT_STEP);
    nextEl.style.display = "";
  } else {
    nextEl.style.display = "none";
  }
  setRich(document.getElementById("ctaMyth"), result.mythReframe || "");
  setRich(document.getElementById("ctaWatch"), result.watch);
  setRich(document.getElementById("ctaWhy"), result.why);
  setRich(document.getElementById("seminarScene"), result.seminarScene || "");
  setRich(document.getElementById("consultBridge"), window.CONSULT_BRIDGE || "");

  const kw = document.getElementById("typeKeywords");
  (result.keywords || []).forEach((k) => {
    const span = document.createElement("span");
    span.className = "keyword-chip";
    span.textContent = k;
    kw.appendChild(span);
  });

  const ul = document.getElementById("ctaBenefits");
  result.benefits.forEach((b) => {
    const li = document.createElement("li");
    li.textContent = b;
    ul.appendChild(li);
  });

  setRich(document.getElementById("consultHint"), result.consultHint || "");

  const copyBtn = document.getElementById("copyBtn");
  const copyNote = document.getElementById("copyNote");
  const copyText = result.lineCopy || `診断結果：${result.name}\nセミナー当日、この結果を見ながら聞きます。`;
  copyBtn.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(copyText);
    } catch (e) {
      const ta = document.createElement("textarea");
      ta.value = copyText;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
    }
    copyBtn.textContent = "コピーしました";
    copyNote.textContent = "LINEのトーク画面を開いて、貼って送ってください。";
    setTimeout(() => {
      copyBtn.textContent = "持参文をコピーする";
    }, 2500);
  });

  try {
    const order = ["T1", "T2", "T3"];
    let scores = null;

    const sParam = params.get("s");
    if (sParam) {
      const parts = sParam.split(",").map((n) => parseInt(n, 10));
      if (parts.length === order.length && parts.every((n) => Number.isFinite(n))) {
        scores = {};
        order.forEach((type, i) => { scores[type] = parts[i]; });
      }
    }

    if (!scores && sessionStorage.getItem("freqType") === key) {
      const raw = sessionStorage.getItem("freqScores");
      if (raw) scores = JSON.parse(raw);
    }

    if (scores) {
      const board = document.getElementById("scoreBoard");
      order.forEach((type) => {
        const row = document.createElement("div");
        row.className = "score-row score-row-3";
        const val = scores[type] || 0;
        const label = (window.TYPE_LABEL && window.TYPE_LABEL[type]) || type;
        row.innerHTML = `
          <span>${label}</span>
          <div class="meter"><i style="width:${(val / 5) * 100}%"></i></div>
          <span>${val}</span>
        `;
        board.appendChild(row);
      });
      document.getElementById("scoresWrap").style.display = "block";
    }
  } catch (e) {}
})();
</script>
</body>
</html>
