<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>愛されない周波数タイプ</title>
<meta property="og:title" content="愛されない周波数タイプ診断">
<meta property="og:type" content="website">
<link rel="stylesheet" href="result.css">
</head>
<body>
<div class="page" id="page">
  <div class="cover">
    <!-- タイプ名は画像に焼き込み済み -->
    <img id="typeImage" alt="" width="960" height="540">
    <h1 id="typeName" class="sr-only"></h1>
    <span id="typeCode" class="sr-only"></span>
  </div>
  <style>.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}</style>

  <div class="body">
    <p class="lead-line" id="typeLead"></p>
    <p class="desc" id="typeDesc"></p>
  </div>

  <div class="scores" id="scoresWrap" style="display:none">
    <h3>あなたの周波数スコア</h3>
    <div id="scoreBoard"></div>
  </div>

  <div class="cta-box">
    <h3 id="ctaTitle"></h3>
    <p class="why" id="ctaWhy"></p>
    <ul id="ctaBenefits"></ul>

    <div class="action-box">
      <p class="action-lead">今すぐできること</p>
      <p class="action-text">
        この診断結果を、LINEのトーク画面に一言送ってください。<br>
        「当てはまってた」だけでも大丈夫です。
      </p>
      <button class="copy-btn" id="copyBtn" type="button">タイプ名をコピーする</button>
      <p class="action-note" id="copyNote">コピーしたら、そのままLINEに貼って送ってください。</p>
      <p class="action-warn">
        当日、「うまくいかない共通点」を解説する場面で、<br>
        あなたのタイプが呼ばれたときにいちばん深く刺さります。<br>
        今日の"当てはまった"気づきを、当日まで持っていってください。
      </p>
    </div>

    <a class="ghost-btn" href="index.html">診断トップへ戻る</a>
    <div class="nav-links">
      <a href="gallery.html">全タイプ一覧を見る</a>
    </div>
  </div>
</div>

<script src="types-data.js"></script>
<script>
(function () {
  const params = new URLSearchParams(location.search);
  const key = (params.get("id") || "").toUpperCase();
  const result = window.RESULTS[key];

  if (!result) {
    document.getElementById("page").innerHTML =
      '<div class="body"><p>タイプが見つかりません。<a href="index.html">診断トップへ</a></p></div>';
    return;
  }

  document.title = result.name + "｜愛されない周波数タイプ診断";
  document.querySelector('meta[property="og:title"]').setAttribute("content", result.name);

  document.getElementById("typeImage").src = result.image;
  document.getElementById("typeImage").alt = result.name;
  document.getElementById("typeName").textContent = result.name;
  document.getElementById("typeCode").textContent = result.code;
  document.getElementById("typeLead").textContent = result.lead;
  document.getElementById("typeDesc").textContent = result.desc;
  document.getElementById("ctaTitle").textContent = `「${result.name}」のあなたが、当日いちばん刺さるところ`;
  document.getElementById("ctaWhy").textContent = result.why;

  const ul = document.getElementById("ctaBenefits");
  result.benefits.forEach((b) => {
    const li = document.createElement("li");
    li.textContent = b;
    ul.appendChild(li);
  });

  // タイプ名をコピー→LINEに貼ってもらう（着席前のコミットメント作り）
  const copyBtn = document.getElementById("copyBtn");
  const copyNote = document.getElementById("copyNote");
  const copyText = `診断結果：${result.name}（${result.code}）`;
  copyBtn.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(copyText);
    } catch (e) {
      const ta = document.createElement("textarea");
      ta.value = copyText;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
    }
    copyBtn.textContent = "コピーしました";
    copyNote.textContent = "LINEのトーク画面を開いて、貼って送ってください。";
    setTimeout(() => {
      copyBtn.textContent = "タイプ名をコピーする";
    }, 2500);
  });

  // 診断直後ならスコアを表示
  try {
    const raw = sessionStorage.getItem("freqScores");
    if (raw) {
      const scores = JSON.parse(raw);
      const board = document.getElementById("scoreBoard");
      const order = ["A", "B", "C", "D", "E"];
      order.forEach((axis) => {
        const row = document.createElement("div");
        row.className = "score-row";
        const val = scores[axis] || 0;
        row.innerHTML = `
          <span>${window.AXIS_NAME[axis]}</span>
          <div class="meter"><i style="width:${(val / 2) * 100}%"></i></div>
          <span>${val}</span>
        `;
        board.appendChild(row);
      });
      document.getElementById("scoresWrap").style.display = "block";
    }
  } catch (e) {}
})();
</script>
</body>
</html>
