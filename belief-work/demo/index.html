<script>
const days = [{"title":"最近、気持ちが動いたのはどんなとき？","body":["今日から14日間、","毎日1つずつワークに取り組んで、","ノートに書き出していきましょう。","このワークでは、","日常の中で気持ちが動いたとき、","・あなたが何を考えて","・どんな気持ちになって、","・どんな行動をしているのかを、","1つずつ振り返っていきます。","例）職場で自分が話しかけたとき、","周りの人が静かになったように感じた","「もしかして、嫌われているのかな？」","そんなふうに考えて悲しくなったり、","みんなとの距離を感じたりする。","友だちから結婚の報告を聞いたとき、","素直に100％の気持ちで喜べない。","「私はこのままでいいのかな？」","そう考えて、焦りを感じ、","家に帰ってからマッチングアプリを開いてみる。","このように同じ出来事でも、","何を考えるかは人によって違います。","そして、そのとき","考えたことによって気持ちが変わったり","そのあとに取る行動が","変わったりすることがあります。","ただ、自分がそのとき何を考えていたのかは、","意識して振り返らないと意外と気づけないものです。","なので本日のワークでは、","最近あなたの気持ちが動いた場面を1つ思い返して、","実際にノートに書き出してみましょう。","【今日のワーク】","最近、気持ちが動いた場面を1つ選んで、次の3つを書き出してみましょう。","恋愛、仕事、家族、友人関係など、どんな場面でも大丈夫です。","① どんな場面だったか","いつ、どこで、誰と、何があったかを書く","例：職場で、自分が話しかけると周りの人が静かになるような気がした","例：友だちから結婚の報告を聞いた","② その時どんなことを考えていたか","頭に浮かんだことを、そのまま「 」に入れて書く","例：「もしかして、嫌われているのかな？」","例：「私はこのままでいいのかな？」","③ そのあと自分がしたこと","例：みんなに話しかけるのをためらった","例：家に帰ってマッチングアプリを開いた","いい・悪いは決めなくて大丈夫です。","思い出したとおりに書いてみましょう。","書き終わったら、ノートを閉じます📔","明日は、この場面でのあなたの気持ちを振り返っていきましょう！","思い込みを手放す14日ワーク"],"questions":["① どんな場面だったか","② その時どんなことを考えていたか","③ そのあと自分がしたこと"]},{"title":"そのとき、本当はどうなってほしかった？","body":["昨日は、気持ちが動いた場面と、","そのとき考えたこと、","そのあと自分がしたことを書きました。","今日は、そのときの気持ちと、","本当はどうなってほしかったのか","を振り返ってみましょう。","例）自分がいるときに","周りが静かになるような気がして、","「もしかして、嫌われているのかな？」","と考えたとき","悲しくなったり、虚しさを感じたり、","孤独を感じたりするかもしれません。","そして、その気持ちの奥には、","「本当はみんなと楽しく話したい」","「仲間として受け入れてほしい」","という思いがあるのかも","友だちの結婚報告を聞いて焦ったときも、","ただ焦っているのではなく、","「本当は私も、安心できるパートナーと出会いたい」","という思いがあるのかも","このように、気持ちの奥には、","自分が本当に望んでいることが","隠れている場合があります。","自分の本当の気持ちに気づくことで、","今まで無意識に取っていた行動の意味も","見えてくることがあります。","本日のワークでは、","昨日の場面を思い返しながら、","自分の気持ちと「本当はどうなってほしかったのか」","を書き出してみましょう。","【今日のワーク】","昨日書いたページを開いて、","その下に次の3つを書き出してみましょう。","① そのとき、どんな気持ちだったか","例）悲しかった。虚しかった。孤独を感じた。焦った。うらやましかった。","② 本当は、どうなってほしかったか","例）「みんなと気兼ねなく話したかった」","例）「仲間として受け入れてほしかった」","例）「私も、大切にしてくれる人と出会いたい」","すぐに思いつかなければ、","「どうなってほしかったんだろう？」と、","自分に問いかけてみてください。","③ その気持ちや本音は、","自分の行動にどう繋がっていたか","昨日書いた行動を振り返りながら、考えてみましょう。","例）嫌われているかもしれないと思って、みんなに話しかけるのをためらった","例）恋人がほしいという気持ちから、マッチングアプリを開いた","うまく言葉にできないときは、","「分からない」と書いても大丈夫です。","書き終わったら、ノートを閉じます📔","明日は、1日目に考えたことを、","過去にも同じように考えたことがなかったか","振り返っていきましょう！","思い込みを手放す14日ワーク"],"questions":["① そのとき、どんな気持ちだったか","② 本当は、どうなってほしかったか","③ その気持ちや本音は、"]},{"title":"前にも、同じように考えたことはある？","body":["昨日は、そのときの気持ちと、","本当はどうなってほしかったのかを書きました。","今日は、1日目に書いた「考えたこと」を、","過去にも同じように考えた経験がないか、","振り返ってみましょう。","例）自分がいるときに周りが静かになるような気がして、","「もしかして、嫌われているのかな？」と考えた","振り返ってみると、学生時代にも、","友だち同士が盛り上がっているときに","「私がいると楽しくないのかな」","と感じたことがあった気がする","あるいは、職場で自分の意見に反応がなかったときにも、","「私は受け入れてもらえないんだ」と考えたことがあるかも。","こうして振り返ると、","違う場面でも似たような考え方を","していることに気づく場合があります。","もちろん、過去の経験と今回の出来事が、","必ずしも同じ理由で起きているとは限りません。","今日は、その理由を決めたり、","考え方を変えようとしたりしなくて大丈夫です。","まずは、","「私は、こういうときに、こう考えやすいんだな」と気づくことが大切です。","本日のワークでは、1日目に書いた考えをもとに、過去の経験を振り返ってみましょう。","【今日のワーク】","新しいページに、次の3つを書き出してみましょう。","① 1日目の②に書いた考えを書き写す","\n例）「もしかして、嫌われているのかな？」","「私はこのままでいいのかな？」","② 前にも同じように考えたことがあるか","いつ、どこで、誰と、何があったのかを書く。","例）学生時代、友だち同士が盛り上がっているとき。","職場で自分の意見に反応がなかったとき。","過去の恋愛、家族、友達、職場など、","どんな場面でも大丈夫！思い出せなければ、","「思い出せない」と書いておきましょう。","③ 今回と過去の場面で、似ているところはあるか","例）どちらも、周りの反応を見て\n「自分は受け入れてもらえていないのかもしれない」と考えていた","相手の気持ちを確かめる前に、自分の中で悪い方向に考えていた\n","似ているところが見つからなくても大丈夫です。\n無理に共通点を探そうとせず、\n気づいたことをそのまま書いてみましょう。","\n書き終わったら、ノートを閉じます📔","\n明日は、これまで書き出してきたことをもとに、\n自分がどんなときに気持ちが動きやすいのか、\nさらに振り返っていきましょう！"],"questions":["① 1日目の②に書いた考えを書き写す","② 前にも同じように考えたことがあるか","③ 今回と過去の場面で、似ているところはあるか"]},{"title":"私は、どんなときに気持ちが動きやすい？","body":["昨日は、1日目に書いた考えを、\n過去にも同じように考えたことがないか振り返りました。","今日は、これまで書いた場面を並べて、\n自分がどんなときに気持ちが動きやすいのか\n振り返ってみましょう。","例）職場で自分が話しかけると周りが静かになったとき。\n学生時代、友達同士が盛り上がっていたとき。\nグループラインに連絡したけど返信がこなかったとき。","並べてみると、どれも\n「周りの反応が少ないとき」に、\n気持ちが動いているのかもしれません。","友達から結婚の報告を聞いて焦った人も、\n振り返ってみると同期の昇進を聞いたときや、\nインスタで友だちの婚約の投稿を見たときにも、\n同じように焦っていたことがあるかも。","この場合は、\n「周りの人が先に進んだように見えたとき」に\n気持ちが動きやすいのかもしれません。","このように、自分が気持ちの動きやすい場面を知っておくと、\n 次に同じようなことが起きたとき、\n 「あ、私はこういうときに不安になりやすいんだな」\n と、その場で気づけるようになります。","本日のワークでは、\nこれまでのページを見返しながら、\n自分の気持ちが動きやすい場面を書き出してみましょう。","【今日のワーク】\n新しいページに、次の3つを書き出してみましょう。","① 1日目と3日目に書いた場面を、すべて書き写す","例）職場で自分が話しかけると周りが静かになった \n学生時代、友だち同士が盛り上がっていた \nグループラインに連絡したけど返信がこなかった","② それらの場面で、似ているところはどこか\n誰の、どんな反応があったときかを書く。","例）周りの反応が少なかったとき \n例）周りの人が先に進んだように見えたとき例）自分の頑張りや意見が認められなかったと感じたとき","③ 最近、同じようなことが起きた場面はあるか","例）グループLINEで、自分のメッセージにだけ返信がなかった\n 例）同僚から「彼と一緒に住むことになった」と聞いた\n 例）上司からいつもより短い返事をされて気になった","思い当たらなければ、「なし」と書いて大丈夫です。","書き終わったら、ノートを閉じます📔","明日は、1日目の場面を、\n「実際に起きたこと」と\n「自分が考えたこと」に分けていきましょう！"],"questions":["① 1日目と3日目に書いた場面を、すべて書き写す","② それらの場面で、似ているところはどこか","③ 最近、同じようなことが起きた場面はあるか"]},{"title":"それは本当に起きたこと？ 私が考えたこと？","body":["昨日は、自分がどんなときに\n気持ちが動きやすいのかを書きました。","今日は、1日目の場面を、\n「実際に起きたこと」と\n「自分が考えたこと」に分けてみましょう。","例）職場で、自分が話しかけると周りが静かになった場面。","＊実際に起きたこと（事実）：話しかけたとき、2人が会話を止めた。 ","＊自分が考えたこと（解釈）：「私がいると話しにくいんだ」「嫌われているのかな？」","でも、2人が会話を止めたのは、\n私の話を聞こうとしたからかもしれません。\n\nちょうど話が終わったところだったのかもしれません。","例）友達から結婚の報告を聞いた場面。","＊実際に起きたこと：友だちから「来年の春に結婚する」と言われた。","＊自分が考えたこと：「私だけ取り残されている」「このままじゃ結婚できない」","友だちが結婚することと、\n自分がこれから結婚できるかどうかは、別のことです。","こうして分けてみると、起きたことに、\n自分の考えをすぐに付け足しているかもしれません。","その考えが間違っているという話ではありません。\n\nただ、起きたことと考えたことが混ざったままだと、考えたことを本当に起きたことのように感じて、落ち込んだり焦ったりしやすくなります。","本日のワークでは、1日目の場面を、事実と解釈の2つに分けて書き出してみましょう。","【今日のワーク】\n1日目のページを開いて、その下に次の3つを書き出してみましょう。","① 実際に起きたこと","その場をスマホで動画に撮っていたら映ることだけを書く。","例）話しかけたとき、2人が会話を止めた\n例）友だちから「来年の春に結婚する」と言われた","② 自分が付け足した考え","そのとき、自分はどんな意味づけをしていたのかを書く。","例）「私がいると話しにくいんだ」 \n例）「私だけ取り残されている」","③ その出来事には、ほかにどんな可能性が考えられるか","1〜3つ思いつくものを書く。","例）私の話を聞こうとしたのかも\n 例）ちょうど話が終わったところだったのかも\n 例）仕事のことを考えていたのかも","すぐに思いつかなければ、「分からない」と書いても大丈夫です。あとで思いついた時に追加してください。","無理に前向きな考え方をしようとしなくても大丈夫。\nまずは、起きたことと自分の考えを分けてみましょう。","書き終わったら、ノートを閉じます📔","明日は、1日目に考えたことがどこから来たのかを振り返っていきましょう！"],"questions":["① 実際に起きたこと","② 自分が付け足した考え","③ その出来事には、ほかにどんな可能性が考えられるか"]},{"title":"その考えは、どこから来たんだろう？","body":["昨日は、1日目の場面を、「実際に起きたこと」と「自分が考えたこと」に分けました。","今日は、1日目に考えたことにつながっていそうな、 昔言われた言葉や、これまでの経験を振り返ってみましょう。","例）「嫌われているのかな？」と考えやすい人は、\n 子どものころ、親の機嫌が悪いときに、\n 物音を立てないように静かにしていた経験があるかもしれません。","そうした経験を重ねる中で、\n 「周りの機嫌が悪いときは、 自分が気をつけなければいけない」\n と考えるようになった可能性もあります。","また、「私はこのままでいいのかな？」と考えやすい人は、\n 母親から「早く結婚しなさい」「30歳までには」と今日は、1日目に考えたことにつながっていそうな、昔言われた言葉やこれまでの経験を振り返ってみましょう。","例）「嫌われているのかな？」と考えやすい人は、\n子どものころ、親の機嫌が悪いときに、物音を立てないように静かにしていた経験があるかもしれません。","そうした経験を重ねる中で、\n 「周りの機嫌が悪いときは、自分が気をつけなければいけない」と考えるようになった可能性もあります。","また「私はこのままでいいのかな？」と考えやすい人は、母親から「早く結婚しなさい」「30歳までには」と言われてきたことがあるかもしれません。","こうした言葉や経験から、","・「〇〇しなければいけない」\n ・「〇〇な私はだめだ」","といった考えを、無意識のうちに「自分の当たり前」として持っていることがあります。","このワークでは、こうした考え方を「思い込み」と呼びます。","思い込みを持っていることは 悪いことではありません。","そのときの自分が、周りの環境に適応したり、\n自分を守ったりするために、必要だった考え方なのかもしれません。","また、今の考え方につながっている経験が、必ずしも一つとは限りません。","無理に原因を特定する必要はありません。\nまずは、自分がどんな言葉や経験から、 今の考え方につながるものを受け取ってきたのか、振り返ってみましょう。","本日のワークでは、 1日目に書いた考えにつながっていそうな 「言葉」や「経験」を書き出してみましょう。","【今日のワーク】","新しいページに、次の3つを書き出してみましょう。","① 1日目の②に書いた考えを書き写す","例）「もしかして、嫌われているのかな？」\n 例）「私はこのままでいいのかな？」","② その考えにつながっていそうな言葉や経験はあるか","誰かに言われたことや、 周りの様子を見て感じたことなどを振り返ってみましょう。","いつ、誰との、どんな場面だったかを書いてみてください。","例）小学生のころ、母に「お父さんを怒らせないで」と言われた\n 例）25歳のころ、母に「早く結婚しなさい」と言われた\n 例）職場で、失敗した人が厳しく責められているのを見て、自分も失敗してはいけないと思った","思い当たらなければ、「思い出せない」と書いても大丈夫です。","③ その言葉や経験から、どんなことを「当たり前」だと思うようになったか","例）「周りの空気が悪いときは、出来るだけ私が我慢しなきゃ」\n 例）「30歳までに結婚が出来てない私は難あり（売れ残り）なんだ」\n 例）「失敗する私は、周りから認めてもらえないんだ」","「〜しないように生きなきゃ」「〜出来ない、～な私だからダメなんだ」\n のような形で書いてみましょう。","思い当たることがなくても、無理に答えを出す必要はありません。","過去を振り返ることがつらくなったら、いつでもワークを中断して大丈夫です。","書ける範囲で取り組んでみてくださいね。","書き終わったら、ノートを閉じます📔","明日は、自分がどんなときに安心できるのかを書き出していきましょう！"],"questions":["① 1日目の②に書いた考えを書き写す","② その考えにつながっていそうな言葉や経験はあるか","③ その言葉や経験から、どんなことを「当たり前」だと思うようになったか"]},{"title":"何があると、私は安心できる？","body":["昨日は、1日目に考えたことをもとに\n昔の言葉や経験を振り返りました。","今日は、自分がどんなときに安心できるのか\nを振り返ってみましょう。","例）職場で「嫌われているのかな？」と考えやすい人は、\n朝「おはようございます」と言って笑顔で返してもらえたときや、\nランチに誘われたときに、安心するかもしれません。","友だちの結婚報告を聞いて焦った人は、\n彼から「来年の夏、どこに旅行に行こうか」と、\n嬉しい誘いがあったたときに、安心するかもしれません。","安心できた場面を書き出してみると、\n\n・相手にしてもらったこと\n・自分でできること\n\nの２つに分けられます。","ランチに誘ってもらうのは、相手がしてくれること。自分から「お昼、一緒に行きませんか？」と声をかけるのは、自分でできることです。","相手にしてほしいことがあるのは、自然なことです。","ただ、相手の反応だけに安心を委ねていると、思うような反応が返ってこないときに、不安が大きくなることがあります。","相手に望むことを伝えながら、自分でできることも持っておく。","そうすることで、相手の反応を待つだけでなく、自分から安心につながる行動を選べるようになります。","今日のワークでは、安心できた場面と自分でできることを書き出してみましょう。","【今日のワーク】\n① これまでに安心できた場面を3つ書いてみましょう。","「いつ・誰と・何があったか」を意識して書いてみてください。","例）先週、お気に入りのカフェに行ったら、スタッフさんが笑顔で声をかけてくれた。","例）誕生日に、彼が旅行に誘ってくれた。","例）仕事で担当したプロジェクトが好評で、メンバーも意欲的に取り組んでくれた。","② それぞれの場面で、相手がしてくれたことと、自分がしたことを分けて書いてみましょう。","③ 明日から、自分で安心につながるためにできそうなことを1つ書いてみましょう。","例）自分から挨拶をしてみる。","例）彼に行ってみたい場所を提案してみる。","例）今日できたことや、順調に進んでいることを振り返ってみる。","大きなことでなくて大丈夫です。今の自分にできそうなことを考えてみましょう。","Ex.思い込みを手放す14日ワークが残り半分となりました。","ここまで書いた内容を振り返り\n気づいたことや感想を書いてみましょう。\n\n書き終わったら、ノートを閉じます📔","明日は、「嫌われたくない」「こうするべき」の奥にある、自分が本当はどうしたかったのかを振り返っていきましょう！"],"questions":["① これまでに安心できた場面を3つ書いてみましょう。","② それぞれの場面で、相手がしてくれたことと、自分がしたことを分けて書いてみましょう。","③ 明日から、自分で安心につながるためにできそうなことを1つ書いてみましょう。"]},{"title":"私は、本当はどうしたかった？","body":["これまでのワークで、自分の気持ちが動く場面や、無意識に抱いている考え方を振り返ってきました。","その中で、「嫌われたくない」「こうするべき」と考えて、本当はどうしたいのかよりも、周りの反応や期待を優先して行動していたことがあったかもしれません。","たとえば、職場で「変なことを言って嫌われたくない」と思い、自分の意見を伝えられなかった。","本当は、自分の考えを伝えたり、仲間と意見を交わしたりしたかったのかもしれません。","家族に何かを頼まれたとき、「断ったら悪い」と思って引き受けた。","本当は、今日は自分の時間を大切にしたかったのかもしれません。","友だちの結婚報告を聞いて、「自分も早く相手を見つけるべき」と思い、焦って行動した。","本当は、友だちの幸せを一緒に喜んだり、自分のペースでこれからのことを考えたりしたかったのかもしれません。","もちろん、周りのことを考えて行動するのが悪いわけではないので安心してくださいね。","大切なのは、周りの期待に応えることだけでなく、自分の気持ちにも目を向けること。","自分が本当はどうしたいのかに気づくことが、自分らしい選択をするための第一歩になります。","本日のワークでは、これまでの自分の行動を振り返りながら、その奥にある本音を探してみましょう。","【今日のワーク】\n新しいページに、次の3つを書き出してみましょう。","① これまでのページから「嫌われたくない」「〜するべき」と思って取った行動を1つ選ぶ。","例）みんなに話しかけるのをためらった。","例）家に帰って、焦りながらマッチングアプリを開いた。","例）本当は休みたかったけれど、頼まれた仕事を引き受けた。","② そのとき、どう思ってその行動をしたか。","例）「変なことを言って嫌われたくない」","例）「早く相手を見つけるべき」","例）「断ったら迷惑をかけてしまう」","③ 本当は自分はどうしたかったか","「本当は、〜したかった」「～の感覚が欲しかった」の形で書いてみましょう。","例）「本当は、自分の考えを伝えて、一緒に話し合いたかった」","例）「本当は、友だちにおめでとうと伝えて、ゆっくり休みたかった」","例）「本当は、今日は休みたいと伝えたかった」","すぐに答えが浮かばなくても大丈夫です。","「もし嫌われる心配がなかったら、どうしたかっただろう？」「もし誰かの期待を気にしなくていいとしたら、何を選びたいだろう？」と、自分に問いかけてみてください。","今すぐ答えを出すことよりも、自分の本音に目を向けることを大切にしましょう。","書き終わったら、ノートを閉じます📔","明日は、どんな恋愛ができたら幸せかを具体的な場面で書いていきましょう！"],"questions":["① これまでのページから「嫌われたくない」「〜するべき」と思って取った行動を1つ選ぶ。","② そのとき、どう思ってその行動をしたか。","③ 本当は自分はどうしたかったか"]},{"title":"どんな恋愛ができたら、私は幸せ？","body":["これまでのワークでは、自分の気持ちが動く場面や、無意識に抱いている考え方、本当はどうしたかったのかを振り返ってきました。","では、あなたは本当は、どんな毎日を過ごしたいのでしょうか？","たとえば、","仕事で評価されたいと思っている人は、評価されることだけでなく、安心して意見を伝えられたり、仲間と協力して仕事を進められたりする毎日を望んでいるのかもしれません。","家族との関係に悩んでいる人は、相手に合わせ続けるのではなく、自分の気持ちも大切にしながら、穏やかに過ごせる関係を望んでいるのかもしれません。","恋愛で結婚したいと思っている人は、結婚という結果だけでなく、何気ない日常を一緒に楽しんだり、不安なときに気持ちを話し合えたりする関係を望んでいるのかもしれません。","「評価されたい」「結婚したい」「仲良くしたい」という願いの先には、あなたが本当に大切にしたい時間や、感じていたい気持ちがあるのかもしれません。","それに気づくことができると、これから何を選び、どんな行動をしていきたいのかも見えてきます。","本日のワークでは、仕事・家族・友人・恋愛などの人間関係も含めて、あなたが本当に望んでいる毎日を具体的にイメージしてみましょう。","【今日のワーク】\n新しいページに、次の3つを書き出してみましょう。","① あなたが理想とする毎日を、朝から夜まで自由に書いてみましょう。","どこで、誰と、何をして、どんな気持ちで過ごしているでしょうか？","例）職場で仲間と協力して仕事を進め、相手を信頼して仕事を任せられる","例）家族や友人と気を遣いすぎずに自然体で話せる。","例）パートナーと今日あったことを話しながら、ゆっくり食事を楽しめる。","例）夜、自分の時間を楽しみながら「今日もいい1日だった」と思える。","② その毎日の中で、あなたはどんな気持ちが幸せにつながると思いますか？","例）安心感、楽しさ、充実感、自由、つながり、穏やかさ。","③ その毎日に近づくために、今の自分からできそうなことは何ですか？","例）相手の意見を尊重しながら自分の意見を伝えてみる。","例）家族に合わせる前に、自分はどうしたいのか考えてみる。","例）パートナーに、今度一緒に行きたい場所を伝えてみる。","例）リラックスしながら今日のことを振り返ってみる","すべてを一度に変える必要はありません。","まずは、自分が本当に望んでいる毎日に気づくこと。そして、そこに近づくためにできることを、小さく選んでみましょう。","書き終わったら、ノートを閉じます📔","明日は、昨日書いた理想の1日から、\n自分が大切にしたい価値観、想いを見つけていきましょう！"],"questions":["① あなたが理想とする毎日を、朝から夜まで自由に書いてみましょう。","② その毎日の中で、あなたはどんな気持ちが幸せにつながると思いますか？","③ その毎日に近づくために、今の自分からできそうなことは何ですか？"]},{"title":"私は何を大切にして生きたい？","body":["昨日は、自分が理想とする毎日を、具体的な場面で書き出しました。","今日はその1日を振り返りながら、自分が大切にしたいことを見つけていきましょう。","たとえば、仕事で、自分の意見を伝え、仲間と協力して仕事を進める場面を書いた人は、","「自分の考えを尊重してもらえること」「仲間と協力できること」を大切にしたいのかもしれません。","家族と気を遣いすぎずに自然体で話す場面を書いた人は、","「自分の気持ちも大切にできること」\n「安心して本音を話せること」","友人と何気ない会話を楽しんでいる場面を書いた人は、","「気を遣いすぎずに付き合えること」\n「お互いの違いを認め合えること」","パートナーと、今日あったことを話しながら食事を楽しむ場面を書いた人は、","「何気ない時間を一緒に楽しめること」\n「お互いの気持ちを伝え合えること」","を大切にしたいのかもしれません。","このように理想の毎日を振り返ると、自分が大切にしたいことが見えてくることがあります。","自分が何を大切にしたいのかが分かると、何かを選ぶときにも、自分の気持ちを置き去りにせずに考えやすくなります。","周りに合わせて自分の予定を変えてしまうときも、「私は本当はどうしたい？」「自分が大切にしたいことを守れているかな？」と立ち止まるきっかけになります。","大切にしたいことは、人によって違います。正解を探す必要はありません。","本日のワークでは、昨日書いた理想の1日を振り返り、自分が大切にしたいことを見つけてみましょう。","【今日のワーク】\n9日目のページを開いて、その下に次の3つを書き出してみましょう。","どの場面が印象に残ったか、改めて読み返してみましょう。","① 9日目に書いた1日の中で、書いていてうれしくなった場面に下線を引く","② その場面で、自分が大切にしたい、大切にしたことをいくつか書く","例）自分の考えを尊重してもらえること","例）安心して本音を話せること","例）お互いの違いを認め合えること","例）相手を信じてお願いすること","例）何気ない時間を一緒に楽しめること","③ その中で特に大切にしたいことを1つ選び、その理由を書く","大切にしたいこと：安心して本音を話せること","理由：これまで、嫌われるのが怖くて自分の気持ちを我慢することが多かったから。これからは、自分の気持ちも相手の気持ちも大切にできる関係を築きたいから","1つに選べなければ、2つ書いても大丈夫です。","書き終わったら、ノートを閉じます📔","明日は、自分と相手の感じ方の\n違いについて振り返っていきましょう！"],"questions":["① 9日目に書いた1日の中で、書いていてうれしくなった場面に下線を引く","② その場面で、自分が大切にしたい、大切にしたことをいくつか書く","③ その中で特に大切にしたいことを1つ選び、その理由を書く"]},{"title":"相手の気持ちは、決めつけずに確かめよう","body":["昨日は、自分が大切にしたいことを振り返りました。","今日は、人との関わりの中で、自分が考えた相手の気持ちと、相手が本当に思っていることは違うかもしれない、ということを考えてみましょう。","たとえば、職場で、先輩に挨拶をしたのに返事がなかったとき","「私、何か悪いことをしたのかな？」と考える人もいれば、「忙しくて聞こえなかったのかもしれない」と考える人もいます。","友人にメッセージを送っても返信がなかったとき","「私と話したくないのかな？」と思うかもしれません。","でも、相手は仕事や家事で忙しかったり、返信する余裕がなかったりしたのかもしれません。","家族に自分の意見を伝えたとき、反応が薄かったとしても、必ずしも反対されているとは限りません。相手は、まだ考えを整理している途中なのかもしれません。","同じ出来事でも、受け取り方は人それぞれです。","5日目に「実際に起きたこと」と「自分が考えたこと」を分けて考えました。","相手の気持ちについても同じです。","相手の表情や言葉、行動から気持ちを想像することはできます。でも、自分の想像だけで相手の気持ちを決めつけてしまうと、実際には起きていないことまで事実のように感じてしまうことがあります。","そんなときは、まず「これは相手が実際に言ったこと？ それとも、自分がそう思ったこと？」と立ち止まってみましょう。","そして、必要であれば、相手に聞いたり、自分の気持ちを伝えたりしてみる。","自分の気持ちは自分のもの。相手の気持ちは相手のもの。","お互いの気持ちを大切にしながら、言葉で確かめ合うことが、理解を深めるきっかけになります。","本日のワークでは、最近、相手の気持ちを自分の想像で決めてしまった場面を振り返ってみましょう。","【今日のワーク】\n新しいページに、次の3つを書き出してみましょう。","① 最近、相手の気持ちを自分で決めてしまった場面を書く\n「いつ、どこで、誰と、何があったか」を具体的に書いてみましょう。","例）彼からのLINEが3時間返ってこなかった \n例）職場で、先輩に挨拶をしたけれど、返事がなかった　　　　　　　　　　　　　　　　例）家族に自分の考えを伝えたら、相手の反応が薄かった","② そのとき、自分が考えた相手の気持ちを書く","例）「もう私に興味がないんだ」 \n例）「私の仕事に不満があるのかな」　　　　　　　　　　　　　　　　　　　　　　　　例） 「きっと私の意見に反対なんだうな」","③ほかにどんな可能性が考えられるか、そして必要ならどう確かめるかを書く\n例）場面：友人にメッセージを送ったけれど、返信がなかった。","自分が考えたこと：「私と話したくないのかな？」","ほかの可能性：「仕事や家事で忙しいのかもしれない」「返信するのを忘れているのかもしれない」","確かめるための一言：「最近どう？ また時間があるときに話そうね」","相手の本当の気持ちを、無理に当てようとしなくて大丈夫です。","すぐに本人に聞けないこともあるでしょう。そんなときは、ほかの可能性を考えるだけでも十分です。","また、相手に確認するときも、自分の気持ちを我慢する必要はありません。「私はこう感じた」と伝えながら、お互いの考えを知っていくこともできます。","書き終わったら、ノートを閉じます📔","明日は、同じ場面で、いつもとは違う選び方を考えていきましょう！"],"questions":["① 最近、相手の気持ちを自分で決めてしまった場面を書く","② そのとき、自分が考えた相手の気持ちを書く","③ほかにどんな可能性が考えられるか、そして必要ならどう確かめるかを書く"]},{"title":"いつもの私と、これからの私","body":["昨日は、自分が考えた相手の気持ちと、\n相手が本当に思っていることを分けて考えました。","今日は、これまでのワークで振り返ってきた場面から1つ選び、「いつもの私」と「これからの私」を比べてみましょう。","例）職場で、自分が話しかけると周りが静かになったとき。","いつもの私：「私がいると話しにくいのかな？」と考えて、話しかけるのをやめる 　　　　\nこれからの私：\n「たまたま話が途切れただけかもしれない」と考えて、もう少し様子を見たり、そのまま話を続けたりしてみる。","友人から結婚の報告を聞いたとき。","いつもの私：\n「私はこのままでいいのかな？」と焦って、帰宅後すぐにマッチングアプリを開く。","これからの私：\n友人の幸せをお祝いしながら、自分はどんな毎日を過ごしたいのかを考えてみる。アプリを開くかどうかも、焦りではなく自分の気持ちを確かめてから決める。","家族から何かを頼まれたとき。","いつもの私：\n「断ったら悪い」と思って、予定があっても引き受ける。","これからの私：\n自分の予定や気持ちも振り返り、できる範囲で引き受けたり、難しいときは別の日を提案したりする。","ここで大切なのは、いつもの考え方を無理に変えたり、いつも前向きに考えたりすることではありません。","今までとは違う可能性を考えてみること。そして、自分の本音や大切にしたいことを基準に、行動を選べるようになることです。","これまでの自分の考え方や行動にも、そのときの自分なりの理由があったはずです。だから、過去の自分を責める必要はありません。","すぐに新しい行動ができなくても大丈夫です。","まずは「いつもの私以外にも、選べる考え方や行動がある」と気づくことから始めましょう。","本日のワークでは、これまでの場面を1つ選び、これからの自分ならどんな選択ができそうかを考えてみましょう。","【今日のワーク】\n新しいページに、次の3つを書き出してみましょう。","① これまでのページから、場面を1つ選んで書き写す","例）職場で、自分が話しかけると周りが静かになった","② その時のいつもの私が「考えたこと」と「したこと」を書く","例）\n考えたこと：「嫌われているのかな？」 \nしたこと：話しかけるのをやめた","③ 「これからの私」ならどう考え、何をするかを2～3つ書く","例）これからの私が考えること：「話が途切れただけかもしれない。私は、自分の考えを伝えることも大切にしたい」","これからの私がすること：相手の反応だけで決めつけず、もう少し話を続けてみる。","必ずしも、今までと反対の行動を選ぶ必要はありません。自分の気持ちや状況に合った選択肢を考えてみてください。","すぐに思いつかなければ、「ほかにどんな選択肢があるだろう？」と考えるだけでも大丈夫です。","書き終わったら、ノートを閉じます📔","明日は、今日書いた「これからの私」に近づくために、実際に1つやってみましょう！"],"questions":["① これまでのページから、場面を1つ選んで書き写す","② その時のいつもの私が「考えたこと」と「したこと」を書く","③ 「これからの私」ならどう考え、何をするかを2～3つ書く"]},{"title":"「これからの私」に近づくために、今日できることは？","body":["昨日は、いつもの自分の考え方や行動と、これからの自分が選びたい考え方や行動を比べてみました。","今日は、その気づきを実際の行動につなげてみましょう。","自分の思い込みに気づいても、すぐに考え方や行動を変えられるとは限りません。","だからこそ、まずは小さな一歩を試してみることが大切です。","例えば、職場で周りの反応が気になって会話を止めてしまう人なら、お昼休みに隣の人へ「今日のお昼、何を食べましたか？」と声をかけてみる。","友だちの結婚報告を聞いて焦り、自分も何かしなければと感じた人なら、焦りから行動する前に、まずは自分の好きなカフェに立ち寄って、今の気持ちをゆっくり整理してみる。","大切なのは、必ずうまくいくことではありません。","今までの自分とは違う選択肢を、自分で選んでみることです。","実際にやってみると、思っていたより気楽にできるかもしれません。","反対に、難しさや抵抗を感じることもあるでしょう。","どちらも、これからの自分を理解するための大切な気づきです。","今日のワークでは、今の自分にできそうな小さな一歩を決めて、実際に試してみましょう。","【今日のワーク】\n新しいページに、次の3つを書き出してみましょう。","① 今日、試してみたいことは？\n昨日書いた「これからの私」の考え方や行動を参考に、今日できそうなことを1つ選んでみましょう。","何時に・どこで・誰に・何をするのかまで、できるだけ具体的に書いてみてください。","例）職場のお昼休みに、隣の席の人へ「今日のお昼、何を食べましたか？」と聞いてみる。","② 実際にやってみて何が起きた？","行動したあと、実際に起きたことを書いてみましょう。","例）駅前のパン屋さんの話になり、5分くらい楽しく会話ができた。","思っていたとおりにならなかった場合も、そのまま書いて大丈夫です。","③ そのとき何を考え、感じた？","行動する前と後の気持ちや、気づいたことを振り返ってみましょう。","例）話しかける前は少し緊張したけれど、話してみたら思ったより自然に会話ができた。「自分から話しかけても大丈夫なんだ」と感じた。","もし行動できなかった場合は、「できなかった」と書いてみましょう。","そして、どんな考えや気持ちがあったのかを振り返ってみてください。","「失敗した」ではなく、次に自分を理解するためのヒントとして捉えてみましょう。そして今日できなくても明日以降も行動を意識してやってみましょう！","書き終わったら、ノートを閉じます📔","明日は最終日です。14日間で書いてきたことを、これからの選択についてまとめて振り返っていきましょう！"],"questions":["① 今日、試してみたいことは？","② 実際にやってみて何が起きた？","③ そのとき何を考え、感じた？"]},{"title":"14日間で気づいた私のパターン、これからの選択","body":["本日でついに最終日です。","ここまでワークに取り組んできたあなたは、以前よりも自分の考え方や気持ちに目を向ける時間を重ねてきました。","今日は、1日目から13日目までのノートを振り返り、自分の中にどんなパターンがあったのか、そして、これからどんな選択をしていきたいのかを整理してみましょう。","例えば、こんなパターンに気づいた人がいるかもしれません。","周りの反応が少ないと、「嫌われているのかな？」と考えて悲しくなり、自分から話しかけるのをやめてしまう。","でも、本当は周りの人と気兼ねなく話したかった。","あるいは、周りの人が結婚や昇進などで先に進んでいるように見えると、「私も早く何かしなければ」と焦り、本当はどうしたいのかを考える前に行動してしまう。","でも、本当は自分のペースで、自分が納得できる人生をつくりたかった。","自分のパターンに気づくことは、自分を責めるためではありません。","「私はこういうときに、こう考えやすいんだ」と知ることで、次に同じような場面が訪れたとき、別の考え方や行動も選べるようになるため。","これまで無意識に繰り返してきた反応も、気づいた瞬間から、少しずつ見直していくことができます。","そして、ここからが大切です。","14日間で気づいたことを、これからの日常でどう活かしていくのか。","もし今後も、自分の考え方や行動のパターンに気づき、その都度、自分の本音や大切にしたい価値観に立ち返って選択していくとしたら。","あなたの毎日は、どんなふうに変わっていきそうでしょうか？","今日のワークでは、これまでの自分を振り返るだけではなく、これからの自分がどんな人生を選んでいきたいのかも考えてみましょう。","【今日のワーク】\n新しいページに、次の3つを書き出してみましょう。","① 私はどんなパターンを繰り返しやすい？","1日目〜6日目のページを読み返して、 思考・感情・行動のつながりを整理してみましょう。","次の形に当てはまるように書いてみてください。","私は、〇〇のときに「〇〇」と考え、〇〇な気持ちになり、〇〇しやすい。","例）周りの反応が少ないときに「嫌われているのかな？」と考え、悲しい気持ちになり、自分から話しかけるのをやめてしまいやすい。","想像以外の反応だったときに「信じられない」と考え、寂しく、裏切られたような気持ちになり、どうせ誰にも分かってもらえないと距離をおきやすい。","一つに絞れなければ、複数書いても大丈夫です。すべての理由を解明する必要もありません。","② 本当はどうしたい？何を大切にしたい？","8〜10日目のノートを読み返して、自分の本音や大切にしたい価値観を振り返ってみましょう。","本当は、どんな気持ちで毎日を過ごしたい？","人とどんな関係を築いていきたい？","仕事や暮らしの中で、何を大切にしたい？","これから、どんな自分でありたい？","例）仕事で失敗した日も、安心して話を聞いてくれるパートナーと、日常の出来事や気持ちを共有できる関係を築きたい。","自分の本音や価値観が、まだはっきり言葉にならなくても大丈夫です。今の時点で感じていることを書いてみましょう。","③ これからの私は、どんな選択をしていきたい？","ここまでの気づきを、これからの日常でどう活かしていくかを考えてみましょう。","もし、自分の思考や行動のパターンに気づき、本音や大切にしたい価値観をもとに選択できるようになったら。","今までと同じように悩んだり、焦ったりする場面でも、少し立ち止まって、自分に合う選択肢を考えられるかもしれません。","そんな自分になっていくとしたら、あなたは何を変えていきたいですか？","次の3つを書いてみましょう。","1. これからも続けたいこと","例）毎日、自分の気持ちを振り返る時間をつくる。","2. これから少しずつ変えていきたいこと","例）相手から返信がないとき、すぐに「嫌われたのかな？」と決めつけず、ほかの可能性も考えてみる。","3. その先で、実現したい未来","例）相手の反応に振り回されるのではなく、自分の気持ちも相手の気持ちも大切にしながら、安心できる関係を築いていきたい。","大きな目標を決めなくても大丈夫です。","今の自分にできそうなことから、一つずつ選んでいきましょう。","④ その自分になるためにどんなサポートがあったらよさそう？","最後に、これから自分のパターンを見直し、望む未来に近づいていくために、どんなサポートがあるとよさそうかを考えてみましょう。","自分でノートを振り返りながら日常で少しずつ実践していきたい。","自分では気づきにくい思い込みや本音をもっと深く理解したい。","気づいたことを恋愛や仕事の人間関係に活かせるようになりたい。","一人では迷ってしまうところは、誰かと一緒に整理しながら進んでいきたい。","今の自分に近いものを選んでみてください。複数でもここにない答えでも大丈夫です。","自分を理解することは、一度で終わるものではありません。","日常で気づき、振り返り、実践する。その積み重ねが、自分の本音を大切にしながら人生を選んでいく力につながっていきます。","そして、自分一人では気づきにくいことも、誰かと一緒に振り返ることで、新しい視点が見つかることがあります。","今回の14日間で見えてきたことを、これからの自分のために活かしていきましょう。","【最後に】","14日間、お疲れさまでした！！！","ここまでワークに取り組んできたあなたへ。","この14日間で、すべての思い込みに気づけたわけではないかもしれません。考え方や行動が、すぐに変わったと感じられない人もいるでしょう。","それでも、自分の気持ちを振り返り、自分の考え方や行動に目を向けてきたことには意味があります。","大切なのは、これからも自分のパターンに気づき、そのたびに「私は本当はどうしたい？」「今の私にとって、どんな選択が心地いい？」と問いかけてみること。","今までと同じ反応をしてしまう日があっても大丈夫。","気づいたときに、もう一度選び直せばいいのです。","そして、もしこの14日間で「もっと自分のことを理解したい」「自分の本音を大切にしながら、自分の人生を選んでいきたい」と感じたなら、その気持ちも大切にしてほしいと思います。","一人で振り返り、実践を続けていくこともできます。","一方で、自分では当たり前だと思っている考え方や、何度も繰り返してしまう行動の背景には、自分一人では気づきにくいものが隠れていることもあります。","はにぃと一緒に振り返りながら、自分の思考パターンや本音をさらに深く理解し、日常での選択につなげていく。","そうすることで、今回見えてきた気づきを、より具体的な変化へとつなげていけるかもしれません。","自分を知ることは、ゴールではなく、これからの人生を自分で選んでいくためのスタートです。","これからも、自分の気持ちを置き去りにせず、自分が望む未来に向かって、一歩ずつ進んでいきましょう。","あなたは、これからどんな自分になっていきたいですか？","その答えを、これからの日常の中でも、少しずつ見つけていってくださいね。"],"questions":["① 私はどんなパターンを繰り返しやすい？","② 本当はどうしたい？何を大切にしたい？","③ これからの私は、どんな選択をしていきたい？","④ その自分になるためにどんなサポートがあったらよさそう？"]}];
const intro = [];
const by = id => document.getElementById(id);
let answers = [];
let openThrough = 0;
let view = 'work';
let notice = '';
const expanded = new Set([0]);
function add(parent, tag, value) {
  const node = document.createElement(tag);
  node.textContent = value;
  parent.append(node);
  return node;
}
function showAnswers(parent, day, values) {
  day.questions.forEach((question, index) => {
    add(parent, 'strong', question);
    add(parent, 'p', values[index]).className = 'answer';
  });
}
function renderCopy(parent, paragraphs, dayIndex) {
  const dayOneBreaks = new Set(['このワークでは、','友だちから結婚の報告を聞いたとき、','このように同じ出来事でも、','ただ、自分がそのとき何を考えていたのかは、','なので本日のワークでは、']);
  const emphasis = /毎日1つずつ|何を考えて|どんな気持ちになって|どんな行動をしているのか|気持ちが動いた場面を1つ|実際に起きたこと|自分が考えたこと|本当はどうなってほしかった|これからの私/g;
  let block;
  let kind;
  for (const line of paragraphs.flatMap(paragraph => paragraph.split('\n').flatMap(line => line.split(/(?<=。)(?![」』）】]|$)|(?<=。[」』）】])(?!$)/)))) {
    const value = line.trim();
    if (!value) { block = null; continue; }
    const heading = /^【.+】$/.test(value);
    const question = /^[①②③④]/.test(value);
    const example = /^例[）):：]/.test(value);
    const list = /^・/.test(value);
    const newExample = dayIndex === 0 && value === '友だちから結婚の報告を聞いたとき、';
    const nextKind = example || newExample || (kind === 'example' && !/^(このように|このことから|ここで|ただ、|大切なのは)/.test(value) && !heading && !question && !list)
      ? 'example' : list ? 'list' : 'text';
    if (!block || kind !== nextKind || heading || question || (dayIndex === 0 && dayOneBreaks.has(value))) {
      kind = nextKind;
      block = add(parent, 'div', '');
      block.className = 'copy-block copy-' + kind;
    }
    const element = add(block, heading ? 'h3' : 'p', '');
    if (/。[」』）】]*$/.test(value)) element.classList.add('sentence-end');
    if (heading || question) {
      element.classList.add(heading ? 'copy-heading' : 'copy-question');
      element.textContent = line;
    } else if (kind === 'example') {
      element.textContent = line;
    } else {
      let cursor = 0;
      for (const match of line.matchAll(emphasis)) {
        element.append(line.slice(cursor, match.index));
        add(element, 'strong', match[0]);
        cursor = match.index + match[0].length;
      }
      element.append(line.slice(cursor));
    }
  }
}
function changeView(nextView) {
  view = nextView;
  render();
}
function render() {
  by('days').replaceChildren();
  by('history').replaceChildren();
  by('progress').textContent = answers.length + ' / 14日 提出済み';
  by('next').hidden = answers.length === 0 || answers.length === days.length || openThrough >= answers.length;
  by('notice').textContent = notice;
  by('days').hidden = view === 'review';
  by('review').hidden = view !== 'review';
  by('next').hidden ||= view !== 'work';
  ['work', 'review', 'preview'].forEach(name => by(name + 'View').setAttribute('aria-pressed', String(name === view)));
  if (!answers.length) add(by('history'), 'p', 'ワークを提出すると、ここに日別の質問とあなたの回答が表示されます。');
  days.forEach((day, index) => {
    const title = 'Day ' + (index + 1) + ' ｜ ' + day.title;
    const card = add(by('days'), 'details', '');
    const heading = add(card, 'summary', answers[index] ? '✓ 提出済み　' + title : title);
    card.open = expanded.has(index);
    card.ontoggle = () => { if (card.open) expanded.add(index); else expanded.delete(index); };
    if (view === 'preview') {
      const copy = add(card, 'div', '');
      copy.className = 'source-copy';
      renderCopy(copy, day.body, index);
      return;
    }
    if (answers[index]) {
      heading.className = 'submitted';
      const saved = add(card, 'div', '');
      saved.className = 'saved-copy';
      add(saved, 'h3', 'あなたが提出した回答');
      showAnswers(saved, day, answers[index]);
      const article = add(by('history'), 'article', '');
      add(article, 'h3', title);
      showAnswers(article, day, answers[index]);
      return;
    }
    if (index > openThrough) {
      add(card, 'p', index === answers.length
        ? '提出した翌日の0:00から回答できます。'
        : '前日のワークを提出した翌日から回答できます。');
      return;
    }
    const copy = add(card, 'div', '');
    copy.className = 'source-copy';
    renderCopy(copy, day.body, index);
    const form = add(card, 'form', '');
    const fields = day.questions.map(question => {
      const field = add(add(form, 'label', question), 'textarea', '');
      field.required = true;
      field.maxLength = 3000;
      return field;
    });
    const fill = add(form, 'button', 'サンプルを入力');
    fill.type = 'button';
    fill.className = 'secondary';
    fill.onclick = () => fields.forEach((field, i) => field.value = ['相手の返信が遅くて、不安になった。','嫌われたかもしれないと思った。','次は、決めつける前に自分の気持ちを整理したい。','気づいたことを一緒に振り返れると助かる。'][i]);
    add(form, 'button', '提出する');
    form.onsubmit = event => {
      event.preventDefault();
      const values = fields.map(field => field.value.trim());
      const blank = values.indexOf('');
      if (blank >= 0) { fields[blank].value = ''; fields[blank].reportValidity(); return; }
      answers[index] = values;
      expanded.add(index);
      notice = 'Day ' + (index + 1) + 'を提出しました。提出済みの日を開くか、「ワークの振り返り」から回答を確認できます。';
      render();
      by('notice').scrollIntoView({block:'nearest'});
    };
  });
}
by('workView').onclick = () => changeView('work');
by('reviewView').onclick = () => changeView('review');
by('previewView').onclick = () => changeView('preview');
by('next').onclick = () => { openThrough = answers.length; expanded.add(openThrough); render(); by('days').querySelectorAll('details')[openThrough].querySelector('textarea').focus(); };
by('reset').onclick = () => { answers = []; openThrough = 0; notice = ''; view = 'work'; expanded.clear(); expanded.add(0); render(); };
intro.forEach(paragraph => add(document.querySelector('header'), 'p', paragraph));
render();
</script></html>
